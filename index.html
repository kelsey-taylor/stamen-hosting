<!-- Code from d3-graph-gallery.com -->
<!DOCTYPE html>
<meta charset="utf-8">

<!-- Load d3.js -->
<script src="https://d3js.org/d3.v4.js"></script>

<!-- Color palette -->
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>

<h1>Nicolette <> Stamen</h1>
<h2>The first ten years</h2>

<!-- Create a div where the graph will take place -->
<div id="my_dataviz"></div>

<style>
.node:hover{
  stroke-width: 2px !important;
  opacity: 1 !important;
}
body {
  font-family: Helvetica, Arial, sans-serif;
}
h1 {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 20pt;
  line-height: 100%;
  margin: 0;
  padding: 0;
}
h2 {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14pt;
  font-weight: 200;
  line-height: 100%;
  margin: 0;
  padding: 0;
}
</style>

<script>

// set the dimensions and margins of the graph
var width = 1200
var height = 600

// append the svg object to the body of the page
var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width)
    .attr("height", height)

// Read data
d3.csv("https://raw.githubusercontent.com/kelsey-taylor/stamen-hosting/refs/heads/main/nico-harvest-data.csv", function(data) {

data = data.filter(function(d){ return d.value>4 })

  // A scale that gives a X target position for each group
  var x = d3.scaleOrdinal()
    .domain(["Stamen Operations", "Stamen Marketing", "Stamen New Biz", "Stamen R&D", "Allstate", "Amazon", "Amazon Web Services", "American Red Cross", "Auxly", "BAAQMD", "Bill & Melinda Gates Foundation (BMGF)", "Cambridge Systematics", "CAST", "Cepheid", "Cleveland Metroparks", "Columbia University", "Consumer Reports", "CREATE.IO", "Daitem", "Digital Globe", "Earth Genome", "EIG Economic Innovation Group", "Ekman Group", "elsevier", "Exploratorium", "Gensler | Team Uplift", "Givaudan France", "Google", "Google Inc", "HERE", "HOODLINE", "HudHud", "J. Paul Getty Trust", "Johnson & Johnson", "Link Logistics", "Max Planck Institute", "Maxar", "MDRC", "Midwood", "Mirra VR / Kevin Farnham", "Movebank", "MPG Operations LLC", "MPG Ranch", "National Audubon Society", "National Geographic Partners LLC", "NY CITY", "People V Extinction", "Phylagen", "Placer.ai", "Planet Labs", "REBNY", "Salesforce", "Science Museum", "Seattle Dept. of Energy and Env.", "Stanford University", "UC Berkeley", "UC Davis", "University of Richmond", "V AND A", "Virginia Commonwealth University", "Visa", "Washington DC - DOE", "WHO", "Windward Fund (was Otherlab)", "xSensor", "YBCA"])
    .range([483, 431, 28, 843, 256, 132, 805, 367, 394, 823, 608, 534, 865, 524, 795, 803, 178, 885, 697, 461, 362, 898, 519, 567, 325, 169, 618, 667, 424, 309, 428, 601, 83, 499, 888, 664, 386, 723, 507, 759, 535, 253, 878, 853, 158, 167, 324, 472, 816, 620, 435, 352, 759, 131, 262, 553, 683, 737, 486, 490, 649, 556, 527, 384, 870, 761])

  // Color palette for projtype?
  var color = d3.scaleOrdinal()
    .domain(["Stamen Operations", "Stamen Marketing", "Stamen New Biz", "Stamen R&D", "Allstate", "Amazon", "Amazon Web Services", "American Red Cross", "Auxly", "BAAQMD", "Bill & Melinda Gates Foundation (BMGF)", "Cambridge Systematics", "CAST", "Cepheid", "Cleveland Metroparks", "Columbia University", "Consumer Reports", "CREATE.IO", "Daitem", "Digital Globe", "Earth Genome", "EIG Economic Innovation Group", "Ekman Group", "elsevier", "Exploratorium", "Gensler | Team Uplift", "Givaudan France", "Google", "Google Inc", "HERE", "HOODLINE", "HudHud", "J. Paul Getty Trust", "Johnson & Johnson", "Link Logistics", "Max Planck Institute", "Maxar", "MDRC", "Midwood", "Mirra VR / Kevin Farnham", "Movebank", "MPG Operations LLC", "MPG Ranch", "National Audubon Society", "National Geographic Partners LLC", "NY CITY", "People V Extinction", "Phylagen", "Placer.ai", "Planet Labs", "REBNY", "Salesforce", "Science Museum", "Seattle Dept. of Energy and Env.", "Stanford University", "UC Berkeley", "UC Davis", "University of Richmond", "V AND A", "Virginia Commonwealth University", "Visa", "Washington DC - DOE", "WHO", "Windward Fund (was Otherlab)", "xSensor", "YBCA"])
    .range(["#fff21c", "#fff21c", "#fff21c", "#fff21c", "#9400d3", "#8840de", "#775ee8", "#5d77f3", "#2d8dfd", "#559efa", "#77aff4", "#91c1ee", "#a7d3e8", "#9cd2d1", "#84c9b5", "#6ac099", "#4cb77d", "#63bd6a", "#95d05c", "#c0e249", "#e8f42b", "#ffd534", "#ffb742", "#ff974b", "#ff7d4f", "#ff774d", "#ff704b", "#ff6949", "#ff674b", "#ff7f6b", "#ff958a", "#ffabaa", "#ffc0cb"]);

  // Size scale for project hours
  var size = d3.scaleLinear()
    .domain([5, 300, 1000, 4000])
    .range([12, 40, 60, 100])

  // create a tooltip
  var Tooltip = d3.select("#my_dataviz")
    .append("div")
    .style("opacity", 0)
    .attr("class", "tooltip")
    .style("background-color", "white")
    .style("padding", "5px")

  // Three function that change the tooltip when user hover / move / leave a cell
  var mouseover = function(d) {
    Tooltip
      .style("opacity", 1)
  }
  var mousemove = function(d) {
    Tooltip
      .html("<strong>" + d.client  + "<br>" + "</strong>" + d.key + "<br>" + d.value + " hours")
      .style("left", (d3.mouse(this)[0]+20) + "px")
      .style("top", (d3.mouse(this)[1]) + "px")
  }
  var mouseleave = function(d) {
    Tooltip
      .style("opacity", 0)
  }

  // Initialize the circle: all located at the center of the svg area
  var node = svg.append("g")
    .selectAll("circle")
    .data(data)
    .enter()
    .append("circle")
      .attr("class", "node")
      .attr("r", function(d){ return size(d.value)})
      .attr("cx", width)
      .attr("cy", height)
      .style("fill", function(d){ return color(d.client)})
      .style("fill-opacity", 0.8)
      .attr("stroke", "black")
      .style("stroke-width", 0.2)
      .on("mouseover", mouseover) // What to do when hovered
      .on("mousemove", mousemove)
      .on("mouseleave", mouseleave)
      .call(d3.drag() // call specific function when circle is dragged
           .on("start", dragstarted)
           .on("drag", dragged)
           .on("end", dragended));

// Features of the forces applied to the nodes:
var simulation = d3.forceSimulation()
    .force("x", d3.forceX().strength(0.5).x( function(d){ return x(d.client) } ))
    .force("y", d3.forceY().strength(0.1).y( height/2 ))
    .force("center", d3.forceCenter().x(width / 2).y(height / 2)) // Attraction to the center of the svg area
    .force("charge", d3.forceManyBody().strength(1)) // Nodes are attracted one each other of value is > 0
    .force("collide", d3.forceCollide().strength(.5).radius(function(d){ return size(d.value)}).iterations(1)) // Force that avoids circle overlapping

  // Apply these forces to the nodes and update their positions.
  // Once the force algorithm is happy with positions ("alpha" value is low enough), simulations will stop.
  simulation
      .nodes(data)
      .on("tick", function(d){
        node
            .attr("cx", function(d){ return d.x; })
            .attr("cy", function(d){ return d.y; })
      });

  // What happens when a circle is dragged?
  function dragstarted(d) {
    if (!d3.event.active) simulation.alphaTarget(.03).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  function dragged(d) {
    d.fx = d3.event.x;
    d.fy = d3.event.y;
  }
  function dragended(d) {
    if (!d3.event.active) simulation.alphaTarget(.03);
    d.fx = null;
    d.fy = null;
  }

})

</script>
